# 每次推送 / 提交 PR 时自动构建模组，并把产物 jar 上传为 Actions 制品。
name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Loom 1.19.x 需要在 JVM 25 上运行；模组字节码仍通过 release 21 编译。
      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build mod
        run: gradle build --no-daemon --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: NewMod-mod-jars
          path: build/libs/
          retention-days: 7
